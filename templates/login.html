<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lens Today — Sign In</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
    <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="bg-darker text-gray-200 font-sans antialiased min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm px-4">
        <!-- Logo / Brand -->
        <div class="text-center mb-8">
            <span class="text-5xl">📡</span>
            <h1 class="mt-4 text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                Lens Today
            </h1>
            <p class="mt-1 text-sm text-gray-500">Automation Hub — Sign in to continue</p>
        </div>

        <!-- Card -->
        <div class="bg-dark border border-gray-800 rounded-2xl shadow-xl p-8">
            {% if error %}
            <div class="mb-5 px-4 py-3 bg-red-900/40 border border-red-700 text-red-300 text-sm rounded-lg">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">
                        Username
                    </label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        required
                        autocomplete="username"
                        autofocus
                        class="w-full px-4 py-2.5 rounded-lg bg-gray-900 border border-gray-700 text-gray-100 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="admin"
                    >
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">
                        Password
                    </label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-2.5 rounded-lg bg-gray-900 border border-gray-700 text-gray-100 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="••••••••"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-lg shadow transition duration-150"
                >
                    Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
